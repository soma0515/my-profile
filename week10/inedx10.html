<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHubユーザー情報表示ツール</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
      <h1 class="text-2xl font-bold mb-6">GitHubユーザー検索</h1>

      <div class="flex gap-2 mb-6">
        <input id="usernameInput" type="text" placeholder="ユーザー名を入力..."
          class="flex-1 border border-gray-300 rounded px-3 py-2">
        <button id="searchBtn"
          class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">
          検索
        </button>
      </div>

      <!-- 結果表示エリア -->
      <div id="result"></div>
    </div>

    <script>
      const usernameInput = document.querySelector("#usernameInput");
      const searchBtn = document.querySelector("#searchBtn");
      const result = document.querySelector("#result");

      searchBtn.addEventListener("click", () => {
        fetchUser();
      });

      async function fetchUser() {
        const username = usernameInput.value.trim();

        // 何も入力されていなければ何もしない
        if (username === "") {
          return;
        }

        // 検索中は結果エリアをクリアしておく
        result.innerHTML = "";

        try {
          const response = await fetch(`https://api.github.com/users/${username}`);

          // response.okで通信の成功（存在するユーザーか）を確認する
          if (!response.ok) {
            result.innerHTML = `<p class="text-red-500">ユーザーが見つかりませんでした</p>`;
            return;
          }

          const data = await response.json();

          // 取得したデータをConsoleで確認し、今回は以下の4項目を採用した：
          // avatar_url（アバター画像）, name（名前）, bio（自己紹介）, followers（フォロワー数）
          // ※ name はユーザーによって未設定の場合があるため、その時は login（ID）を表示する
          result.innerHTML = `
            <div class="flex flex-col items-center text-center border-t pt-4">
              <img src="${data.avatar_url}" alt="avatar" class="w-24 h-24 rounded-full mb-3">
              <p class="font-bold text-lg">${data.name || data.login}</p>
              <p class="text-sm text-gray-600 mb-2">${data.bio || "自己紹介はありません"}</p>
              <p class="text-sm text-gray-500">フォロワー数：${data.followers}</p>
            </div>
          `;

        } catch (error) {
          // ネットワークエラーなど、通信自体に失敗した場合
          console.error(error);
          result.innerHTML = `<p class="text-red-500">通信エラーが発生しました</p>`;
        }
      }
    </script>

  </body>
</html>
